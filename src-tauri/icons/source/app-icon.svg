<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Source for `npm run tauri icon`.
    Cogitorium app icon. A cogitator monitor showing the project's own emblem:
    a brain seen from above. The left half is flesh, with a bionic cable jacked
    into it; the right half has been replaced by archaic machinery (riveted
    plates, a cog, a vacuum valve, a ribbed conduit) rather than modern
    circuitry, in keeping with a setting that shuns thinking machines. Green
    phosphor, screen style after the Space Marine 2 cogitator screens (see
    CREDITS.md). Bold shapes so it still reads at 16-32px.
  -->
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4139"/>
      <stop offset="0.5" stop-color="#23261f"/>
      <stop offset="1" stop-color="#121410"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a76a"/>
      <stop offset="0.5" stop-color="#7d5c30"/>
      <stop offset="1" stop-color="#3a2914"/>
    </linearGradient>
    <radialGradient id="screen" cx="512" cy="470" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f3517"/>
      <stop offset="0.6" stop-color="#06180a"/>
      <stop offset="1" stop-color="#020703"/>
    </radialGradient>
    <radialGradient id="bloom" cx="512" cy="455" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5dff7a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5dff7a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="3" fill="#000" fill-opacity="0.35"/>
    </pattern>
    <clipPath id="screen-clip">
      <rect x="150" y="150" width="724" height="640" rx="56"/>
    </clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- monitor casing: bronze rim, iron bezel, screws -->
  <rect x="48" y="48" width="928" height="928" rx="190" fill="url(#rim)"/>
  <rect x="80" y="80" width="864" height="864" rx="162" fill="url(#bezel)"/>
  <g fill="#8a6a3a" stroke="#1a120a" stroke-width="5">
    <circle cx="150" cy="872" r="16"/>
    <circle cx="874" cy="872" r="16"/>
  </g>
  <!-- status lamp and grille under the screen -->
  <circle cx="512" cy="872" r="18" fill="#7dff8f" filter="url(#glow)"/>
  <g stroke="#0b0c0a" stroke-width="10" stroke-linecap="round">
    <path d="M300 872H420M604 872H724"/>
  </g>

  <!-- screen -->
  <rect x="142" y="142" width="740" height="656" rx="62" fill="#000"/>
  <g clip-path="url(#screen-clip)">
    <rect x="150" y="150" width="724" height="640" fill="url(#screen)"/>
    <rect x="150" y="150" width="724" height="640" fill="url(#bloom)"/>

    <!-- faint circuitry -->
    <g stroke="#2e8a3c" stroke-opacity="0.35" stroke-width="5" fill="none">
      <path d="M190 300H300L340 340V420M834 300H724L684 340V420M190 640H290L330 600M834 640H734L694 600"/>
    </g>

    <!-- header and footer bars, chamfered frame lines -->
    <g fill="#5dff7a" fill-opacity="0.55">
      <rect x="196" y="190" width="150" height="16" rx="3"/>
      <rect x="362" y="190" width="70" height="16" rx="3"/>
      <rect x="720" y="190" width="108" height="16" rx="3"/>
    </g>
    <path d="M196 226H828" stroke="#5dff7a" stroke-opacity="0.45" stroke-width="5"/>
    <path d="M220 690H804L780 744H244Z" fill="none" stroke="#5dff7a" stroke-opacity="0.8" stroke-width="7"/>
    <g fill="#7dff8f" filter="url(#glow)">
      <!-- +++  =====  +++ -->
      <path d="M262 711h12v-12h10v12h12v10h-12v12h-10v-12h-12Z"/>
      <path d="M306 711h12v-12h10v12h12v10h-12v12h-10v-12h-12Z"/>
      <path d="M684 711h12v-12h10v12h12v10h-12v12h-10v-12h-12Z"/>
      <path d="M728 711h12v-12h10v12h12v10h-12v12h-10v-12h-12Z"/>
      <rect x="400" y="708" width="20" height="20"/>
      <rect x="430" y="700" width="20" height="36"/>
      <rect x="460" y="712" width="20" height="12"/>
      <rect x="490" y="696" width="20" height="44"/>
      <rect x="520" y="704" width="20" height="28"/>
      <rect x="550" y="710" width="20" height="16"/>
      <rect x="580" y="700" width="20" height="36"/>
      <rect x="610" y="708" width="20" height="20"/>
    </g>

    <!-- emblem (original mark): flesh brain on the left with a bionic cable jacked in;
         the right half replaced by archaic machinery -->
    <g filter="url(#glow)" transform="translate(518 452) scale(1.06) translate(-512 -450)">

      <!-- ===== left hemisphere: flesh ===== -->
      <path d="M500 292C470 274 428 278 406 300C374 296 344 316 338 346C308 360 296 394 306 424C288 450 294 488 318 508C314 542 338 572 372 578C390 606 428 618 460 606C478 620 496 616 500 604Z" fill="#6dff84"/>
      <g fill="none" stroke="#04140a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
        <path d="M428 318C446 336 436 356 456 370C470 380 466 398 484 404"/>
        <path d="M352 376C380 372 394 392 420 388C444 384 452 404 476 404"/>
        <path d="M396 444C414 438 430 458 470 456"/>
        <path d="M346 514C372 500 392 522 418 512C440 504 456 522 480 516"/>
        <path d="M398 566C418 552 438 572 466 562"/>
        <path d="M470 312C482 334 470 352 488 366"/>
      </g>

      <!-- bionic port sunk into the flesh, with rivets -->
      <circle cx="372" cy="454" r="30" fill="#04140a" stroke="#6dff84" stroke-width="7"/>
      <g fill="#6dff84"><circle cx="372" cy="418" r="6"/><circle cx="408" cy="454" r="6"/><circle cx="372" cy="490" r="6"/><circle cx="336" cy="454" r="6"/></g>

      <!-- ===== the cable: ribbed hose from the screen edge into the port ===== -->
      <path d="M196 612C246 612 278 592 300 556C318 526 330 498 346 480" fill="none" stroke="#6dff84" stroke-width="38" stroke-linecap="round"/>
      <path d="M196 612C246 612 278 592 300 556C318 526 330 498 346 480" fill="none" stroke="#04140a" stroke-width="26" stroke-linecap="round"/>
      <path d="M196 612C246 612 278 592 300 556C318 526 330 498 346 480" fill="none" stroke="#6dff84" stroke-width="26" stroke-dasharray="6 9"/>

      <!-- plug and clamp collar -->
      <g transform="rotate(-50 360 466)">
        <rect x="336" y="452" width="48" height="30" rx="5" fill="#04140a" stroke="#6dff84" stroke-width="7"/>
        <path d="M346 452V482M374 452V482" stroke="#6dff84" stroke-width="5"/>
      </g>

      <!-- ===== right hemisphere: machinery ===== -->
      <path d="M524 292C554 274 596 278 618 300C650 296 680 316 686 346C716 360 728 394 718 424C736 450 730 488 706 508C710 542 686 572 652 578C634 606 596 618 564 606C546 620 528 616 524 604Z" fill="#6dff84" fill-opacity="0.14" stroke="#6dff84" stroke-width="10" stroke-linejoin="round"/>
      <!-- riveted armour-plate seams -->
      <g fill="none" stroke="#6dff84" stroke-width="8" stroke-linecap="round">
        <path d="M528 386C590 376 650 380 700 396"/>
        <path d="M528 492C596 484 662 486 718 474"/>
      </g>
      <g fill="#6dff84"><circle cx="548" cy="372" r="6"/><circle cx="604" cy="368" r="6"/><circle cx="660" cy="376" r="6"/><circle cx="548" cy="478" r="6"/><circle cx="614" cy="474" r="6"/><circle cx="680" cy="474" r="6"/></g>

      <!-- top plate: a cog -->
      <g transform="translate(598 338) scale(0.85)" fill="#6dff84">
        <rect x="-9" y="-46" width="18" height="16" rx="3" transform="rotate(0)"/><rect x="-9" y="-46" width="18" height="16" rx="3" transform="rotate(45)"/><rect x="-9" y="-46" width="18" height="16" rx="3" transform="rotate(90)"/><rect x="-9" y="-46" width="18" height="16" rx="3" transform="rotate(135)"/><rect x="-9" y="-46" width="18" height="16" rx="3" transform="rotate(180)"/><rect x="-9" y="-46" width="18" height="16" rx="3" transform="rotate(225)"/><rect x="-9" y="-46" width="18" height="16" rx="3" transform="rotate(270)"/><rect x="-9" y="-46" width="18" height="16" rx="3" transform="rotate(315)"/>
        <circle r="34"/>
        <circle r="13" fill="#04140a"/>
      </g>

      <!-- middle plate: a vacuum valve with a lit filament -->
      <g fill="none" stroke="#6dff84" stroke-width="7" stroke-linejoin="round">
        <path d="M630 466V418C630 398 646 386 660 386C674 386 690 398 690 418V466Z" fill="#04140a"/>
        <path d="M644 452 652 430 660 452 668 430 676 452" stroke-width="5"/>
        <path d="M624 466H696" stroke-width="10"/>
      </g>
      <path d="M548 420H604V444H630" fill="none" stroke="#6dff84" stroke-width="7"/>

      <!-- bottom plate: a ribbed conduit, the flesh's fold becoming pipework -->
      <path d="M480 516H560C590 516 600 550 630 550C656 550 664 528 690 522" fill="none" stroke="#6dff84" stroke-width="24" stroke-linecap="round"/>
      <path d="M480 516H560C590 516 600 550 630 550C656 550 664 528 690 522" fill="none" stroke="#04140a" stroke-width="12" stroke-linecap="round"/>
      <path d="M480 516H560C590 516 600 550 630 550C656 550 664 528 690 522" fill="none" stroke="#6dff84" stroke-width="12" stroke-dasharray="5 8"/>


      <!-- the divide between flesh and machine -->
      <path d="M512 286V614" stroke="#04140a" stroke-width="12"/>
    </g>

    <!-- scanlines and glass sheen -->
    <rect x="150" y="150" width="724" height="640" fill="url(#scan)"/>
    <path d="M190 190C320 168 520 166 700 180" stroke="#fff" stroke-opacity="0.08" stroke-width="26" fill="none" stroke-linecap="round"/>
  </g>
  <rect x="150" y="150" width="724" height="640" rx="56" fill="none" stroke="#000" stroke-width="10"/>
</svg>
